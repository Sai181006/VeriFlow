[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriflow"
version = "0.1.0"
description = "A schema-aware compiler for CSV pipelines"
requires-python = ">=3.12"

[project.scripts]
veriflow = "veriflow.cli:main"

[tool.setuptools.packages.find]
include = ["veriflow*"]
